    <!--
      La tarjeta que sale al compartir el enlace (WhatsApp, Facebook, Instagram). Esos servicios
      no ejecutan JavaScript: leen solo este archivo, así que la imagen es la misma para toda la
      web. La dirección va completa porque WhatsApp no acepta rutas relativas; con dominio
      propio, cambiarla aquí. Imagen: public/og.jpg (2912 × 1440, JPG); si se cambia, actualizar aquí sus medidas.
    -->
    <meta property="og:url" content="https://agp-desing.vercel.app/" />
    <meta property="og:site_name" content="AGP Desing" />
    <meta property="og:image" content="https://agp-desing.vercel.app/og.jpg" />
